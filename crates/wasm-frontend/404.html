<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — specter</title>
<style>
  :root {
    --color-abyss: #171717;
    --color-surface: #1e1e1e;
    --color-bright-gray: #eeeeee;
    --color-medium-gray: #bcbcbc;
    --color-graphite: #3f3f3f;
    --color-amethyst: #7c3aed;
    --color-amethyst-hover: #6d28d9;
    --color-lavender: #a78bfa;
    --color-tag-bg: rgba(138, 92, 245, 0.15);
    --font-sans: 'ui-sans-serif, system-ui', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  body {
    background: var(--color-abyss);
    color: var(--color-bright-gray);
    font-family: var(--font-sans);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    text-align: center;
  }
  .box {
    max-width: 480px;
    border: 1px solid var(--color-graphite);
    box-shadow: rgba(255, 255, 255, 0.05) 0px 0px 0px 1px inset;
    padding: 40px 32px;
    background: var(--color-surface);
    border-radius: 12px;
  }
  .tag {
    font: 600 11px var(--font-mono);
    color: var(--color-lavender);
    background: var(--color-tag-bg);
    padding: 3px 10px;
    border-radius: 9999px;
    display: inline-block;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 12px;
    letter-spacing: -0.03em;
    color: var(--color-bright-gray);
  }
  p {
    font-size: 14px;
    color: var(--color-medium-gray);
    margin-bottom: 24px;
    line-height: 1.5;
  }
  a {
    display: inline-block;
    background: var(--color-amethyst);
    color: #ffffff;
    text-decoration: none;
    font: 500 13px var(--font-sans);
    padding: 12px 22px;
    border-radius: 8px;
    box-shadow: 0 4px 14px -2px rgba(124, 58, 237, 0.4);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  a:hover {
    background: var(--color-amethyst-hover);
    transform: translateY(-1px);
  }
</style>
<script>
  // Redirect back to base path while preserving path / hash / query
  const segment = window.location.pathname.split('/').filter(Boolean);
  const base = segment.length > 0 ? '/' + segment[0] + '/' : './';
  setTimeout(() => {
    window.location.replace(base);
  }, 1200);
</script>
</head>
<body>
<div class="box">
  <span class="tag">404 / NOT FOUND</span>
  <h1>Signal Lost.</h1>
  <p>The requested route does not exist. Redirecting back to the cryptanalysis workbench...</p>
  <a href="./">Return to Desk ↗</a>
</div>
</body>
</html>
